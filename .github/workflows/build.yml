name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 镜像自带 Android SDK（ANDROID_HOME 已配好）。
      # 不再用 android-actions/setup-android：它会去装已废弃的 "tools" 包，
      # 在新版 cmdline-tools 上直接 exit 1（实测）。
      - name: Ensure SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + release APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Show APK
        run: |
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: reactor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: reactor-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
