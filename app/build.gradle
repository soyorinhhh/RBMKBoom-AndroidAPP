plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 正式签名从环境变量读取；没有就退回 debug 签名（保证 CI 也能产出可直接安装的包）。
// 生成方式见 README「发行签名」一节。
def externalKeystore = System.getenv("REACTOR_KEYSTORE")
def hasExternalSigning = externalKeystore != null && !externalKeystore.isEmpty() && file(externalKeystore).exists()

android {
    namespace 'com.example.reactor'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.reactor"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    if (hasExternalSigning) {
        signingConfigs {
            release {
                storeFile file(externalKeystore)
                storePassword System.getenv("REACTOR_KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("REACTOR_KEY_ALIAS") ?: "reactor"
                keyPassword System.getenv("REACTOR_KEY_PASSWORD") ?: ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasExternalSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
